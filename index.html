<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAXI RUSH LIFE - Soshanguve</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center;overflow:hidden}
h1{color:#facc15;margin:5px;font-size:22px}
#score{font-size:18px;margin:5px}
canvas{background:#222;display:block;margin:auto;border:3px solid #facc15;border-radius:10px;max-width:95vw}
button{padding:12px 20px;margin:5px;font-size:16px;border:none;border-radius:10px;background:#facc15;font-weight:bold}
#controls{margin-top:8px}
</style>
</head>
<body>
<h1>🚕 TAXI RUSH LIFE</h1>
<div id="score">Score: 0 | Lives: 3 | Passengers: 0</div>
<canvas id="game" width="360" height="520"></canvas>
<div id="controls">
<button onclick="move(-1)">⬅️ LEFT</button>
<button onclick="move(1)">RIGHT ➡️</button><br>
<button onclick="startGame()">▶️ START / RESTART</button>
</div>
<p>Dodge red cars! Pick up green passengers! Rush to Soshanguve!</p>
<script>
let c=document.getElementById("game"),x=c.getContext("2d");
let taxi={x:150,y:430,w:50,h:80},cars=[],people=[],score=0,lives=3,pass=0,playing=false,keys={};
function move(d){taxi.x+=d*30; if(taxi.x<10)taxi.x=10; if(taxi.x>300)taxi.x=300;}
document.addEventListener("keydown",e=>{if(e.key=="ArrowLeft")move(-1); if(e.key=="ArrowRight")move(1);});
function startGame(){score=0;lives=3;pass=0;cars=[];people=[];playing=true;loop();}
function spawn(){
 if(Math.random()<0.03) cars.push({x:Math.floor(Math.random()*6)*55+10,y:-80,w:50,h:80});
 if(Math.random()<0.015) people.push({x:Math.floor(Math.random()*6)*55+15,y:-30});
}
function loop(){
 if(!playing) return;
 spawn();
 x.clearRect(0,0,360,520);
 // road lines
 x.fillStyle="#333"; x.fillRect(0,0,360,520);
 x.fillStyle="#facc15";
 for(let i=0;i<6;i++){ x.fillRect(58+i*55, (i*90 + score)%520, 4, 40); }
 // taxi
 x.fillStyle="#facc15"; x.fillRect(taxi.x,taxi.y,taxi.w,taxi.h);
 x.fillStyle="#000"; x.fillRect(taxi.x+5,taxi.y+10,40,20);
 x.fillStyle="#fff"; x.font="bold 12px Arial"; x.fillText("TAXI",taxi.x+8,taxi.y+45);
 // cars
 for(let i=cars.length-1;i>=0;i--){let car=cars[i]; car.y+=5+score/200;
  x.fillStyle="#ef4444"; x.fillRect(car.x,car.y,car.w,car.h);
  x.fillStyle="#fff"; x.fillText("CAR",car.x+8,car.y+45);
  if(car.x<taxi.x+taxi.w && car.x+car.w>taxi.x && car.y<taxi.y+taxi.h && car.y+car.h>taxi.y){cars.splice(i,1);lives--; if(lives<=0){playing=false; alert("GAME OVER! Score: "+score+" Passengers: "+pass);}}
  if(car.y>520) cars.splice(i,1);
 }
 // people
 for(let i=people.length-1;i>=0;i--){let p=people[i]; p.y+=3;
  x.fillStyle="#22c55e"; x.beginPath(); x.arc(p.x+15,p.y+15,15,0,Math.PI*2); x.fill();
  x.fillStyle="#fff"; x.font="bold 10px Arial"; x.fillText("R10",p.x+2,p.y+18);
  if(p.x<taxi.x+taxi.w && p.x+30>taxi.x && p.y<taxi.y+taxi.h && p.y+30>taxi.y){people.splice(i,1);pass++;score+=50;}
  if(p.y>520) people.splice(i,1);
 }
 score+=1;
 document.getElementById("score").innerText=`Score: ${score} | Lives: ${lives} | Passengers: ${pass}`;
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
